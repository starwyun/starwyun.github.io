<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>插件功能 - 星卫云服务器</title>
  <!-- 网站图标 -->
  <link rel="icon" type="image/png" href="https://starwyun.top/images/logo.png">
  <!-- 字体与图标库 -->
  <link href="https://fonts.lug.ustc.edu.cn/css2?family=Montserrat&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.lug.ustc.edu.cn/css2?family=Nanum+Gothic&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.lug.ustc.edu.cn/css2?family=Nunito+Sans&amp;family=Raleway:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style>
    /* ----- 背景轮播固定全屏 ----- */
    .slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 3s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    .bg-indicator {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      border-radius: 40px;
      pointer-events: none;
    }
    .bg-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.3s;
    }
    .bg-indicator span.active-dot {
      background: white;
      transform: scale(1.3);
      box-shadow: 0 0 10px white;
    }

    /* 右上角导航菜单 - 插件功能放最后 */
    nav {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    nav a {
      color: #1e293b;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 30px;
      transition: all 0.2s;
      font-size: 15px;
      white-space: nowrap;
    }
    nav a:hover {
      background: #2563eb;
      color: white;
    }
    nav a.active {
      background: #2563eb;
      color: white;
    }

    @media (max-width: 640px) {
      nav {
        top: 10px;
        right: 10px;
        padding: 4px 8px;
        flex-wrap: wrap;
        max-width: calc(100% - 80px);
      }
      nav a {
        padding: 4px 10px;
        font-size: 13px;
      }
    }

    /* 左上角 Logo (固定) */
    .logo-fixed {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    /* 主要内容区域：滚动且背景透明 */
    .main-content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      background: transparent;
      padding-top: 80px;
    }

    .plugins-container {
      max-width: 1200px;
      margin: 0 auto 3rem;
      padding: 0 1.5rem;
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .category-tab {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .category-tab:hover, .category-tab.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .search-box {
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: center;
    }
    .search-box input {
      width: 100%;
      max-width: 500px;
      padding: 0.8rem 1.5rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .plugins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .plugin-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.5);
      transition: transform 0.2s;
    }
    .plugin-card:hover {
      transform: translateY(-4px);
    }
    .plugin-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .plugin-category {
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      background: rgba(37,99,235,0.1);
      color: #2563eb;
    }
    .plugin-desc {
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .plugin-badge {
      font-size: 0.75rem;
      background: #e2e8f0;
      color: #475569;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <!-- 固定背景轮播图层 -->
  <div class="slideshow" id="slideshow"></div>
  <div class="overlay"></div>
  <div class="bg-indicator" id="bgIndicator"></div>

  <!-- 右上角导航菜单 - 顺序：首页、服务器简介、联系我们、精彩活动、插件功能 -->
  <nav>
    <a href="https://starwyun.top/">首页</a>
    <a href="https://starwyun.top/intro.html">服务器简介</a>
    <a href="https://starwyun.top/contact.html">联系我们</a>
    <a href="https://starwyun.top/activity.html">精彩活动</a>
    <a href="https://starwyun.top/plugins.html" class="active">插件功能</a>
  </nav>

  <!-- 左上角 Logo (固定) -->
  <div class="logo-fixed">
    <img src="https://starwyun.top/images/logo.png" alt="星卫云服务器" style="width: 60px; height: auto;">
    <span style="color: black; font-style: italic; font-weight: 500; font-size: 16px; margin-top: 4px; text-shadow: 0 1px 2px rgba(255,255,255,0.5);">星卫云</span>
  </div>

  <!-- 主要内容区（可滚动，背景透明） -->
  <div class="main-content">
    <div class="plugins-container">
      <h1 class="text-4xl font-bold text-center text-gray-900 mb-4">⚙️ 服务器插件功能列表</h1>
      <p class="text-center text-gray-600 mb-8 text-lg">星卫云共装载 60+ 款插件，涵盖管理、保护、趣味等各个方面</p>

      <!-- 分类筛选标签 -->
      <div class="category-tabs" id="categoryTabs">
        <span class="category-tab active" data-category="all">全部</span>
        <span class="category-tab" data-category="protect">🛡️ 保护/安全</span>
        <span class="category-tab" data-category="admin">👑 管理/权限</span>
        <span class="category-tab" data-category="gameplay">🎮 玩法/趣味</span>
        <span class="category-tab" data-category="economy">💰 经济/商店</span>
        <span class="category-tab" data-category="chat">💬 聊天/信息</span>
        <span class="category-tab" data-category="utility">🔧 工具/辅助</span>
      </div>

      <!-- 搜索框 -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜索插件名称或功能...">
      </div>

      <!-- 插件网格 -->
      <div class="plugins-grid" id="pluginsGrid"></div>
      <div id="noResults" class="text-center text-gray-500 py-10 hidden">没有找到匹配的插件</div>
    </div>
  </div>

  <script>
    (function() {
      // ----- 背景轮播 -----
      const images = [
        'https://starwyun.top/images/image1.png',
        'https://starwyun.top/images/image2.png',
        'https://starwyun.top/images/image3.png',
        'https://starwyun.top/images/image4.png'
      ];

      const total = images.length;
      const slideshow = document.getElementById('slideshow');
      const indicator = document.getElementById('bgIndicator');

      images.forEach((url) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.style.backgroundImage = `url('${url}')`;
        slide.style.backgroundColor = '#2d2d2d';
        slideshow.appendChild(slide);
      });

      const slides = document.querySelectorAll('.slide');
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('span');
        indicator.appendChild(dot);
      }
      const dots = indicator.querySelectorAll('span');

      let currentIndex = 0;
      slides[currentIndex].classList.add('active');
      dots[currentIndex]?.classList.add('active-dot');

      function nextSlide() {
        slides[currentIndex].classList.remove('active');
        dots[currentIndex]?.classList.remove('active-dot');
        currentIndex = (currentIndex + 1) % total;
        slides[currentIndex].classList.add('active');
        dots[currentIndex]?.classList.add('active-dot');
      }
      setInterval(nextSlide, 5000);
      images.forEach(url => { new Image().src = url; });

      // ----- 插件数据 (根据最新分类整理) -----
      const plugins = [
        // 保护/安全类
        { name: 'AntiPopup', category: 'protect', desc: '移除 1.19+ 客户端的聊天报告弹窗，防止玩家因聊天内容被举报 ' },
        { name: 'BlockLocker', category: 'protect', desc: '通过告示牌保护箱子、门等容器，支持共享和红石控制 ' },
        { name: 'BlockProt', category: 'protect', desc: 'GUI图形化上锁插件，保护容器和功能方块，支持好友添加 ' },
        { name: 'CatSeedLogin', category: 'protect', desc: '猫种子登录系统，支持注册/登录、防顶号、IP限制、邮箱找回 ' },
        { name: 'CoreProtect', category: 'protect', desc: '强大的方块记录和防熊插件，可查询和回滚破坏记录 ' },
        { name: 'Dominion', category: 'protect', desc: '领地保护插件，划分区域防止他人破坏' },
        { name: 'MineGuard', category: 'protect', desc: '综合反作弊/反破坏保护插件' },

        // 管理/权限类
        { name: 'CommandsManage', category: 'admin', desc: '⛏️ 服主自研插件，用于服务器指令权限的精细化管理' },
        { name: 'LuckPerms', category: 'admin', desc: '最强大的权限管理插件，支持组继承、世界细分权限' },

        // 玩法/趣味类
        { name: 'AxAFKZone', category: 'gameplay', desc: '挂机区域奖励，玩家在AFK区可随机获得物品/指令奖励 ' },
        { name: 'ChainMining', category: 'gameplay', desc: '连锁挖矿，支持自定义方块和工具，提高采集效率 ' },
        { name: 'CraftEngine', category: 'gameplay', desc: '服务端自定义物品/方块/家具框架，无需客户端模组 ' },
        { name: 'CustomNPCs', category: 'gameplay', desc: '自定义NPC，创建任务、商店、剧情角色' },
        { name: 'DuelTime', category: 'gameplay', desc: '玩家决斗系统，可押注经济' },          // 从economy移入
        { name: 'ExecutableItems', category: 'gameplay', desc: '可执行物品，赋予物品特殊技能和效果' },
        { name: 'FlyPlus', category: 'gameplay', desc: '飞行插件，可控制飞行速度、防飞行挂机' },
        { name: 'GSit', category: 'gameplay', desc: '动作插件，支持坐下、躺下、翻滚' },
        { name: 'HatCommand', category: 'gameplay', desc: '/hat 指令，可将手中物品戴在头上' },
        { name: 'ItemMakerX', category: 'gameplay', desc: '自定义物品制作器，创建独特装备道具' },
        { name: 'SetHome', category: 'gameplay', desc: '/sethome 设置家/回家系统' },
        { name: 'TPA', category: 'gameplay', desc: '传送请求系统，玩家间互相传送' },
        { name: 'WelcomeFireworks', category: 'gameplay', desc: '玩家进入服务器时自动放烟花欢迎' },
        { name: 'voicechat', category: 'gameplay', desc: '简单语音聊天插件，近距离语音' },
        { name: 'ZMusic', category: 'gameplay', desc: '点歌系统，支持网易云/QQ音乐等' },

        // 经济/商店类
        { name: 'LEconomy', category: 'economy', desc: '轻量级经济系统，管理虚拟货币' },
        { name: 'PlayerAuctions', category: 'economy', desc: '玩家拍卖行，可上架物品竞拍' },
        { name: 'QuickShop-Hikari', category: 'economy', desc: '高性能木牌商店，右键即可购买' },

        // 聊天/信息类
        { name: 'DeluxeMenus', category: 'chat', desc: '高级菜单GUI，用于创建各类功能菜单' },
        { name: 'DeluxeTags', category: 'chat', desc: '聊天头衔系统，显示玩家称号' },
        { name: 'Dmentions', category: 'chat', desc: '@提及玩家通知插件' },
        { name: 'JoinCommandPlugin', category: 'chat', desc: '玩家加入时自动执行指令' },
        { name: 'JoinMessage', category: 'chat', desc: '自定义玩家进出服务器消息' },
        { name: 'MenuReport', category: 'chat', desc: 'GUI菜单举报系统，玩家可举报违规行为' },
        { name: 'OverhedMessage', category: 'chat', desc: '头顶消息显示，展示玩家自定义文字' },
        { name: 'SimplePlayTime', category: 'chat', desc: '统计玩家在线时长' },
        { name: 'TAB', category: 'chat', desc: '玩家列表（Tab键）格式化，可显示前缀后缀、动画' },  // 从admin移入
        { name: 'PlayerTitle', category: 'chat', desc: '玩家称号系统，可自定义称号展示' },          // 从gameplay移入
        { name: 'TntChat', category: 'chat', desc: '聊天管理/过滤/格式优化' },

        // 工具/辅助类 (包含重新分类的插件)
        { name: 'Chunky', category: 'utility', desc: '预生成区块工具，降低服务器跑图卡顿 ' },
        { name: 'Geyser', category: 'utility', desc: '互通核心，让基岩版玩家加入Java版服务器' },
        { name: 'GWarp', category: 'utility', desc: '公共传送点系统' },
        { name: 'HuHoBot', category: 'utility', desc: '机器人插件，用于群内白名单管理' },
        { name: 'Images', category: 'utility', desc: '在游戏内展示图片/像素画' },
        { name: 'InventorySee', category: 'utility', desc: '管理员查看/管理玩家背包' },
        { name: 'LiteSignIn', category: 'utility', desc: '轻量签到插件，每日奖励' },
        { name: 'Metro', category: 'utility', desc: '地铁/交通系统插件' },
        { name: 'MiniMOTD', category: 'utility', desc: '自定义服务器MOTD（服务器列表描述）' },      // 从admin移入
        { name: 'Multiverse-Core', category: 'utility', desc: '多世界管理核心' },
        { name: 'nightcore', category: 'utility', desc: '优化服务器性能的核心管理工具' },          // 从admin移入
        { name: 'ProtocolLib', category: 'utility', desc: '协议库，众多插件的依赖前置' },          // 从admin移入
        { name: 'RecipeCreateX', category: 'utility', desc: '自定义合成配方' },
        { name: 'SCore', category: 'utility', desc: '前置核心库' },
        { name: 'SkinsRestorer', category: 'utility', desc: '离线皮肤修复，让正版/盗版玩家都能显示皮肤' }, // 从protect移入
        { name: 'floodgate', category: 'utility', desc: 'Geyser配套插件，让基岩版玩家直接进入无需正版验证' }, // 从protect移入
        { name: 'spark', category: 'utility', desc: '性能分析插件，查看CPU/TPS/内存占用' },        // 从admin移入
        { name: 'ViaBackwards', category: 'utility', desc: '低版本客户端兼容高版本服务端' },
        { name: 'ViaVersion', category: 'utility', desc: '版本兼容核心，支持多版本客户端' },
        { name: 'WorldEdit', category: 'utility', desc: '创世神，建筑辅助工具' },
        { name: 'WorldListTrashCan', category: 'utility', desc: '垃圾桶/清理功能' },
        { name: 'PlaceholderAPI', category: 'utility', desc: '变量前置库，所有变量插件的依赖' }     // 从chat移入
      ];

      // 渲染插件网格
      function renderPlugins(filterCategory = 'all', searchTerm = '') {
        const grid = document.getElementById('pluginsGrid');
        const noResults = document.getElementById('noResults');
        
        const filtered = plugins.filter(p => {
          const matchCategory = filterCategory === 'all' || p.category === filterCategory;
          const matchSearch = searchTerm === '' || 
            p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.desc.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCategory && matchSearch;
        });

        if (filtered.length === 0) {
          grid.innerHTML = '';
          noResults.classList.remove('hidden');
          return;
        }

        noResults.classList.add('hidden');
        grid.innerHTML = filtered.map(p => `
          <div class="plugin-card">
            <div class="plugin-name">
              <i class="fas fa-cube text-blue-500 text-sm"></i>
              ${p.name}
            </div>
            <div class="plugin-category">
              ${getCategoryName(p.category)}
            </div>
            <div class="plugin-desc">${p.desc}</div>
            ${p.name === 'CommandsManage' ? '<span class="plugin-badge">✨ 服主自研</span>' : ''}
          </div>
        `).join('');
      }

      function getCategoryName(cat) {
        const map = {
          'protect': '🛡️ 保护/安全',
          'admin': '👑 管理/权限',
          'gameplay': '🎮 玩法/趣味',
          'economy': '💰 经济/商店',
          'chat': '💬 聊天/信息',
          'utility': '🔧 工具/辅助'
        };
        return map[cat] || cat;
      }

      // 初始化显示全部
      renderPlugins();

      // 分类标签点击事件
      const tabs = document.querySelectorAll('.category-tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const category = tab.dataset.category;
          const searchTerm = document.getElementById('searchInput').value;
          renderPlugins(category, searchTerm);
        });
      });

      // 搜索输入事件
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        const activeTab = document.querySelector('.category-tab.active');
        const category = activeTab?.dataset.category || 'all';
        renderPlugins(category, e.target.value);
      });
    })();
  </script>
</body>
</html>
