  <style>
    /* ----- 背景轮播固定全屏 ----- */
    .slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 3s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    .bg-indicator {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      border-radius: 40px;
      pointer-events: none;
    }
    .bg-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.3s;
    }
    .bg-indicator span.active-dot {
      background: white;
      transform: scale(1.3);
      box-shadow: 0 0 10px white;
    }

    /* 右上角导航菜单 - 新增“资源下载”放在最后 */
    nav {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    nav a {
      color: #1e293b;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 30px;
      transition: all 0.2s;
      font-size: 15px;
      white-space: nowrap;
    }
    nav a:hover {
      background: #2563eb;
      color: white;
    }
    nav a.active {
      background: #2563eb;
      color: white;
    }

    @media (max-width: 640px) {
      nav {
        top: 10px;
        right: 10px;
        padding: 4px 8px;
        flex-wrap: wrap;
        max-width: calc(100% - 80px);
      }
      nav a {
        padding: 4px 10px;
        font-size: 13px;
      }
    }

    /* 左上角 Logo (固定) */
    .logo-fixed {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    /* 主要内容区域：滚动且背景透明 */
    .main-content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      background: transparent;
      padding-top: 80px;
    }

    .download-container {
      max-width: 800px;
      margin: 0 auto 3rem;
      padding: 0 1.5rem;
    }

    /* 下载卡片样式 */
    .download-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      text-align: center;
    }
    .download-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1rem;
    }
    .download-subtitle {
      font-size: 1.2rem;
      color: #334155;
      margin-bottom: 2.5rem;
    }
    .download-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      background: rgba(255,255,255,0.6);
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      margin-bottom: 1rem;
    }
    .item-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .item-icon {
      font-size: 2rem;
      color: #2563eb;
    }
    .item-name {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1e293b;
    }
    .item-desc {
      font-size: 0.9rem;
      color: #64748b;
    }
    .download-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body>
  <!-- 固定背景轮播图层 -->
  <div class="slideshow" id="slideshow"></div>
  <div class="overlay"></div>
  <div class="bg-indicator" id="bgIndicator"></div>

  <!-- 右上角导航菜单 - 新增“资源下载”放在最后 -->

  <!-- 左上角 Logo (固定) -->
  <div class="logo-fixed">
    <img src="https://starwyun.top/images/logo.png" alt="星卫云服务器" style="width: 60px; height: auto;">
    <span style="color: black; font-style: italic; font-weight: 500; font-size: 16px; margin-top: 4px; text-shadow: 0 1px 2px rgba(255,255,255,0.5);">星卫云</span>

  <!-- 主要内容区（可滚动，背景透明） -->
  <div class="main-content">
    <div class="download-container">
      <div class="download-card">
        <h1 class="download-title">📥 资源下载</h1>
        <p class="download-subtitle">为优化游戏体验，我们提供了服务器专用资源包，推荐所有玩家安装。</p>
        
        <!-- 单个下载项 -->

          <div class="item-info">
            <span class="item-icon"><i class="fas fa-cube"></i></span>
            <div>

              <div class="item-desc">包含自定义材质、模型，提升视觉体验</div>

          <a href="https://raw.githubusercontent.com/starwyun/Server_ResourcePack/refs/heads/main/星卫云服务器资源包.zip" class="download-btn" target="_blank">
            <i class="fas fa-download"></i> 下载
          </a>
        </div>

        <p class="text-sm text-gray-500 mt-4">提示：下载后请在游戏中将资源包放入 resourcepacks 文件夹，或通过服务器自动提示安装。</p>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ----- 背景轮播 -----
      const images = [
        'https://starwyun.top/images/image1.png',
        'https://starwyun.top/images/image2.png',
        'https://starwyun.top/images/image3.png',
        'https://starwyun.top/images/image4.png'
      ];

      const total = images.length;
      const slideshow = document.getElementById('slideshow');
      const indicator = document.getElementById('bgIndicator');

      images.forEach((url) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.style.backgroundImage = `url('${url}')`;
        slide.style.backgroundColor = '#2d2d2d';
        slideshow.appendChild(slide);
      });

      const slides = document.querySelectorAll('.slide');
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('span');
        indicator.appendChild(dot);
      }
      const dots = indicator.querySelectorAll('span');

      let currentIndex = 0;
      slides[currentIndex].classList.add('active');
      dots[currentIndex]?.classList.add('active-dot');

      function nextSlide() {
        slides[currentIndex].classList.remove('active');
        dots[currentIndex]?.classList.remove('active-dot');
        currentIndex = (currentIndex + 1) % total;
        slides[currentIndex].classList.add('active');
        dots[currentIndex]?.classList.add('active-dot');
      }
      setInterval(nextSlide, 5000);
      images.forEach(url => { new Image().src = url; });
    })();
  </script>
</body>
