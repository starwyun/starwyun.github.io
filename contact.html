  <style>
    /* ----- 背景轮播核心样式 ----- */
    .slideshow {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 3s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
    }

    .bg-indicator {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      border-radius: 40px;
      pointer-events: none;
    }
    .bg-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.3s;
    }
    .bg-indicator span.active-dot {
      background: white;
      transform: scale(1.3);
      box-shadow: 0 0 10px white;
    }

    /* 右上角导航菜单 */
    nav {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    nav a {
      color: #1e293b;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 30px;
      transition: all 0.2s;
      font-size: 15px;
      white-space: nowrap;
    }
    nav a:hover {
      background: #2563eb;
      color: white;
    }
    nav a.active {
      background: #2563eb;
      color: white;
    }

    @media (max-width: 640px) {
      nav {
        top: 10px;
        right: 10px;
        padding: 4px 8px;
      }
      nav a {
        padding: 4px 10px;
        font-size: 13px;
      }
    }

    /* 联系方式卡片样式 */
    .contact-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 700px;
      margin: 5rem auto 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .contact-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
      margin-bottom: 2rem;
    }
    .contact-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }
    .contact-item:last-child {
      border-bottom: none;
    }
    .contact-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .contact-content {
      flex: 1;
      font-size: 1.2rem;
      color: #334155;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
    }
    .contact-label {
      font-weight: 600;
      color: #2563eb;
      min-width: 80px;
    }
    .contact-value {
      color: #1e293b;
    }
    .contact-link {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: white;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .contact-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }
    .contact-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 1rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <!-- 背景轮播脚本 -->
  <script>
    (function() {
      const images = [
        'https://starwyun.top/images/image1.png',
        'https://starwyun.top/images/image2.png',
        'https://starwyun.top/images/image3.png',
        'https://starwyun.top/images/image4.png'
      ];

      const total = images.length;
      if (total === 0) return;

      const slideshow = document.getElementById('slideshow');
      const indicator = document.getElementById('bgIndicator');

      images.forEach((url) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.style.backgroundImage = `url('${url}')`;
        slide.style.backgroundColor = '#2d2d2d';
        slideshow.appendChild(slide);
      });

      const slides = document.querySelectorAll('.slide');

      for (let i = 0; i < total; i++) {
        const dot = document.createElement('span');
        indicator.appendChild(dot);
      }
      const dots = indicator.querySelectorAll('span');

      let currentIndex = 0;
      slides[currentIndex].classList.add('active');
      if (dots.length) dots[currentIndex].classList.add('active-dot');

      function nextSlide() {
        slides[currentIndex].classList.remove('active');
        if (dots.length) dots[currentIndex].classList.remove('active-dot');

        currentIndex = (currentIndex + 1) % total;

        slides[currentIndex].classList.add('active');
        if (dots.length) dots[currentIndex].classList.add('active-dot');
      }

      const intervalTime = 5000;
      let timer = setInterval(nextSlide, intervalTime);

      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          clearInterval(timer);
        } else {
          timer = setInterval(nextSlide, intervalTime);
        }
      });

      images.forEach(url => {
        const img = new Image();
        img.src = url;
      });
    })();
  </script>
