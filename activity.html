<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>精彩活动 - 星卫云服务器</title>
  <!-- 网站图标 (favicon) -->
  <link rel="icon" type="image/png" href="https://starwyun.top/images/logo.png">
  <!-- 字体与图标库 -->
  <link href="https://fonts.lug.ustc.edu.cn/css2?family=Montserrat&amp;display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.lug.ustc.edu.cn/css2?family=Nanum+Gothic&amp;display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.lug.ustc.edu.cn/css2?family=Nunito+Sans&amp;family=Raleway:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/brands.min.css" integrity="sha512-apX8rFN/KxJW8rniQbkvzrshQ3KvyEH+4szT3Sno5svdr6E/CP0QE862yEeLBMUnCqLko8QaugGkzvWS7uNfFQ==" crossorigin="anonymous">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style>
    /* ----- 背景轮播核心样式 ----- */
    .slideshow {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 3s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
    }

    .bg-indicator {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      border-radius: 40px;
      pointer-events: none;
    }
    .bg-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.3s;
    }
    .bg-indicator span.active-dot {
      background: white;
      transform: scale(1.3);
      box-shadow: 0 0 10px white;
    }

    /* 右上角导航菜单 */
    nav {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    nav a {
      color: #1e293b;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 30px;
      transition: all 0.2s;
      font-size: 15px;
      white-space: nowrap;
    }
    nav a:hover {
      background: #2563eb;
      color: white;
    }
    nav a.active {
      background: #2563eb;
      color: white;
    }

    @media (max-width: 640px) {
      nav {
        top: 10px;
        right: 10px;
        padding: 4px 8px;
      }
      nav a {
        padding: 4px 10px;
        font-size: 13px;
      }
    }

    /* 活动卡片样式 */
    .activity-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 800px;
      margin: 5rem auto 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .activity-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
      margin-bottom: 2rem;
    }
    .activity-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.2rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }
    .activity-item:last-child {
      border-bottom: none;
    }
    .activity-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .activity-content {
      flex: 1;
      font-size: 1.2rem;
      line-height: 1.6;
      color: #334155;
    }
    .activity-highlight {
      color: #2563eb;
      font-weight: 600;
    }
    .activity-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 1.1rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <!-- 右上角导航菜单 -->
  <nav>
    <a href="https://starwyun.top/">首页</a>
    <a href="https://starwyun.top/intro">服务器简介</a>
    <a href="https://starwyun.top/contact">联系我们</a>
    <a href="https://starwyun.top/activity" class="active">精彩活动</a>
    <a href="https://starwyun.top/download">资源下载</a>
    <a href="https://starwyun.top/sponsor">赞助</a>
  </nav>

  <!-- 左上角 Logo + 黑色斜体文字 -->
  <div style="position: fixed; top: 20px; left: 20px; z-index: 100; display: flex; flex-direction: column; align-items: center; pointer-events: none;">
    <img src="https://starwyun.top/images/logo.png" alt="星卫云服务器" style="width: 60px; height: auto;">
    <span style="color: black; font-style: italic; font-weight: 500; font-size: 16px; margin-top: 4px; text-shadow: 0 1px 2px rgba(255,255,255,0.5);">星卫云</span>
  </div>

  <!-- 主要内容区 -->
  <div class="bg-white">
    <div class="relative mr-auto ml-auto w-full flex flex-col items-center min-h-screen">
      
      <!-- 背景轮播图层 -->
      <div class="slideshow" id="slideshow"></div>
      <div class="overlay"></div>
      <div class="bg-indicator" id="bgIndicator"></div>

      <!-- 活动卡片 -->
      <div class="activity-card content-wrapper" style="z-index: 2;">
        <h1 class="activity-title">🎉 精彩活动 · 豪礼相送 🎉</h1>
        
        <ul class="activity-list">
          <!-- 活动1 -->
          <li class="activity-item">
            <span class="activity-icon">1</span>
            <div class="activity-content">
              <span class="activity-highlight">邀请朋友</span> 来到服务器，即可领取<span class="activity-highlight">萌新大礼包</span> + 专属<span class="activity-highlight">“MVP++”称号</span> + <span class="activity-highlight">老手神装</span>一套！
            </div>
          </li>
          <!-- 活动2 -->
          <li class="activity-item">
            <span class="activity-icon">2</span>
            <div class="activity-content">
              <span class="activity-highlight">帮助服主宣传服务器</span>，可领取<span class="activity-highlight">服务器管理员永久权限</span> + 专属<span class="activity-highlight">“宣传师”称号</span>。
            </div>
          </li>
          <!-- 活动3 -->
          <li class="activity-item">
            <span class="activity-icon">3</span>
            <div class="activity-content">
              <span class="activity-highlight">举报服务器漏洞 / 举报外挂玩家</span>，一经核实即可领取<span class="activity-highlight">100生存币</span>奖励！
            </div>
          </li>
        </ul>

        <div class="activity-note">
          ⭐ 所有奖励请联系管理员领取，活动长期有效 ⭐
        </div>
      </div>
    </div>
  </div>

  <!-- 背景轮播脚本 -->
  <script>
    (function() {
      const images = [
        'https://starwyun.top/images/image1.png',
        'https://starwyun.top/images/image2.png',
        'https://starwyun.top/images/image3.png',
        'https://starwyun.top/images/image4.png'
      ];

      const total = images.length;
      if (total === 0) return;

      const slideshow = document.getElementById('slideshow');
      const indicator = document.getElementById('bgIndicator');

      images.forEach((url) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.style.backgroundImage = `url('${url}')`;
        slide.style.backgroundColor = '#2d2d2d';
        slideshow.appendChild(slide);
      });

      const slides = document.querySelectorAll('.slide');

      for (let i = 0; i < total; i++) {
        const dot = document.createElement('span');
        indicator.appendChild(dot);
      }
      const dots = indicator.querySelectorAll('span');

      let currentIndex = 0;
      slides[currentIndex].classList.add('active');
      if (dots.length) dots[currentIndex].classList.add('active-dot');

      function nextSlide() {
        slides[currentIndex].classList.remove('active');
        if (dots.length) dots[currentIndex].classList.remove('active-dot');

        currentIndex = (currentIndex + 1) % total;

        slides[currentIndex].classList.add('active');
        if (dots.length) dots[currentIndex].classList.add('active-dot');
      }

      const intervalTime = 5000;
      let timer = setInterval(nextSlide, intervalTime);

      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          clearInterval(timer);
        } else {
          timer = setInterval(nextSlide, intervalTime);
        }
      });

      images.forEach(url => {
        const img = new Image();
        img.src = url;
      });
    })();
  </script>
</body>
</html>
